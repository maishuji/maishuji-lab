<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Blue, cream, canvas: an original 2CV-inspired design illustration</title>
  <desc id="desc">Hand-drawn design illustration accompanying the editable car_2cv.obj source. Tall curved cabin, canvas roof, curved bonnet, separate blue wings, four thin wheels, round lamps and cream bumpers. This is not a mesh projection, not a Dreamcast render and not proof of the authored geometry. The Python tool can derive a separate accurate triangle preview when execution is available.</desc>
  <defs>
    <radialGradient id="paper" cx="49%" cy="39%" r="75%">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eeeae0"/>
    </radialGradient>
    <radialGradient id="ground">
      <stop stop-color="#263947" stop-opacity=".19"/>
      <stop offset="1" stop-color="#263947" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: sans-serif; fill: #263947; }
      .eyebrow { font-size: 11px; letter-spacing: 2px; }
      .small { font-size: 12px; fill: #64757b; }
      .line { stroke: #263947; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1100" height="760" fill="url(#paper)"/>
  <rect x="22" y="22" width="1056" height="716" rx="20" fill="none" stroke="#d1d8d3"/>
  <text x="55" y="66" class="eyebrow">MAISHUJI LAB / ORIGINAL EDITABLE ASSET STUDY</text>
  <text x="52" y="118" font-size="46" font-weight="700" letter-spacing="-1.6">Blue, cream, canvas.</text>
  <text x="56" y="150" font-size="15" fill="#64757b">A 2CV-inspired silhouette. Modest geometry, unmistakable character.</text>
  <g transform="translate(830 61)">
    <rect width="210" height="42" rx="21" fill="#e3eae5"/>
