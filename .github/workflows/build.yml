name: Build Dreamcast examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host C++20 and lifecycle checks
        run: make host-run host-test
  dreamcast:
    runs-on: ubuntu-latest
    container:
      image: maishuji/dc-kos-image@sha256:f89d754629d003f842f8e3a37e5082669542ef965123380a5541157138064f3c
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned KOS toolchain
        run: make check-toolchain
        shell: bash
      - name: Configure and build ${{ matrix.build_type }} ELF
        run: make dreamcast-build DC_BUILD_TYPE=${{ matrix.build_type }}
        shell: bash
      - name: Record target build evidence
        run: ./tools/with-kos.sh ./tools/write-target-build-manifest.sh build-dreamcast ${{ matrix.build_type }}
        shell: bash
      - name: Upload ${{ matrix.build_type }} Dreamcast build evidence
        uses: actions/upload-artifact@v4
        with:
          name: maishuji-pvr-examples-${{ matrix.build_type }}
          path: |
            build-dreamcast/*.elf
            build-dreamcast/*.map
            build-dreamcast/target-build-manifest.txt
            build-dreamcast/target-size.txt
            build-dreamcast/target-toolchain.lock
          if-no-files-found: error
